[project]
name = "trading-system"
version = "0.1.0"
description = "Sistema de trading algoritmico Binance Spot, desarrollo por fases con Codex"
requires-python = ">=3.11"
dependencies = [
    "python-binance>=1.0.19",
    "websocket-client>=1.7.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pandas-ta>=0.3.14b0",
    "vectorbt>=0.26.0",
    "duckdb>=1.0.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.4",
    "python-telegram-bot>=21.0",
    "structlog>=24.1.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "requests>=2.32.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
